<!doctype html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Uni Sushi — Restaurant & Bar, Kuta Bali</title>

  <!-- 1. Preconnect Cukup Sekali Sajai untuk Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- 2. BUNDLED GOOGLE FONTS (Semua font digabung dalam 1 URL request) -->
  <link
    href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Jost:wght@300;400;500;600;700&family=Lora:ital,wght@0,400..700;1,400..700&family=Permanent+Marker&family=Shippori+Mincho:wght@500;600;700;800&display=swap"
    rel="stylesheet">

  <!-- 3. Non-blocking Async Loading untuk Font cdnfonts -->
  <link href="https://fonts.cdnfonts.com/css/back-to-black-demo" rel="stylesheet" media="print"
    onload="this.media='all'">

  <!-- Preload Gambar Hero LCP -->
  <link rel="preload" as="image" href="/images/hero.webp" type="image/webp" fetchpriority="high" />
  <style>
    .maintenance-card {
      position: relative;
      text-align: center;

      /* Supaya isi di dalamnya teratur dan pasti di tengah */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      /* Gunakan !important jika Tailwind masih mencoba menimpa */
      max-width: 32rem !important;
      width: 100%;
      margin: 0 auto;
      z-index: 10;
    }

    .logo {
      width: 5rem;
      height: 5rem;
      border-radius: 9999px;
      margin: 0 auto 2rem auto;
      object-fit: cover;
      box-shadow: 0 0 0 1px rgba(212, 175, 55, 0.4);
      /* ring-1 ring-gold/40 */
      display: block;
    }

    .eyebrow {
      display: flex;
      justify-content: center;
      margin-bottom: 1rem;
      font-size: 0.875rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--gold);
    }

    .title {
      font-family: 'Lora', serif;
      font-size: 1.875rem;
      font-weight: 600;
      line-height: 1.25;
      margin-bottom: 1.25rem;
    }

    @media (min-width: 768px) {
      .title {
        font-size: 2.25rem;
      }
    }

    .text-gold-italic {
      color: var(--gold);
      font-style: italic;
    }

    .description {
      color: var(--text-paper-muted);
      line-height: 1.625;
      margin-bottom: 2.5rem;
      font-size: 0.875rem;
    }

    @media (min-width: 768px) {
      .description {
        font-size: 1rem;
      }
    }

    .btn-wrapper {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      justify-content: center;
    }

    .btn-coral {
      background-color: var(--coral);
      color: #ffffff;
      padding: 0.75rem 1.75rem;
      border-radius: 0.375rem;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      transition: background-color 0.2s ease, transform 0.2s ease;
      display: inline-block;
    }

    .btn-coral:hover {
      background-color: var(--coral-hover);
      transform: translateY(-1px);
    }
  </style>
</head>

</body>

</html>
