  <style>
    /* Custom Variables Khusus Maintenance */
    :root {
      --gold-m: #d4af37;
      --coral-m: #e55b46;
      --coral-hover-m: #d04a35;
      --paper-muted-m: rgba(244, 244, 240, 0.6);
    }

    /* WRAPPER KHUSUS: Mengatur layar penuh tanpa menyentuh 'body' atau '#root' */
    .maintenance-wrapper {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #0d0d0d;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      box-sizing: border-box;
      z-index: 9999; /* Selalu di paling depan */
      overflow-y: auto;
    }

    /* CARD KHUSUS: Konten di tengah presisi */
    .maintenance-card {
      position: relative;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      max-width: 32rem;
      width: 100%;
      margin: auto;
    }

    .maintenance-card .logo {
      width: 5rem;
      height: 5rem;
      border-radius: 9999px;
      margin: 0 auto 1.5rem auto;
      object-fit: cover;
      box-shadow: 0 0 0 1px rgba(212, 175, 55, 0.4);
      display: block;
    }

    .maintenance-card .eyebrow {
      display: flex;
      justify-content: center;
      margin-bottom: 0.75rem;
      font-size: 0.875rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--gold-m);
    }

    .maintenance-card .title {
      font-family: 'Lora', serif;
      font-size: 1.875rem;
      font-weight: 600;
      line-height: 1.25;
      margin-bottom: 1rem;
      color: #ffffff;
    }

    @media (min-width: 768px) {
      .maintenance-card .title {
        font-size: 2.25rem;
      }
    }

    .maintenance-card .text-gold-italic {
      color: var(--gold-m);
      font-style: italic;
    }

    .maintenance-card .description {
      color: var(--paper-muted-m);
      line-height: 1.625;
      margin-bottom: 2rem;
      font-size: 0.875rem;
    }

    @media (min-width: 768px) {
      .maintenance-card .description {
        font-size: 1rem;
      }
    }

    .maintenance-card .btn-wrapper {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      justify-content: center;
    }

    .maintenance-card .btn-coral {
      background-color: var(--coral-m);
      color: #ffffff;
      padding: 0.75rem 1.75rem;
      border-radius: 0.375rem;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      transition: background-color 0.2s ease, transform 0.2s ease;
      display: inline-block;
    }

    .maintenance-card .btn-coral:hover {
      background-color: var(--coral-hover-m);
      transform: translateY(-1px);
    }
  </style>
</head>
